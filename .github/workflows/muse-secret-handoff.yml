name: Muse secret handoff

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    # Keep the real secret on the reviewed default branch, out of pull-request CI.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read MODEL_API_KEY from GitHub Secrets
        id: muse
        uses: ./.github/actions/muse-env
        with:
          model-api-key: ${{ secrets.MODEL_API_KEY }}
      - name: Verify backend environment loading without calling Muse
        env:
          MUSE_ENV_FILE: ${{ steps.muse.outputs.env-file }}
        run: |
          env -u MODEL_API_KEY node --env-file="$MUSE_ENV_FILE" --input-type=module -e '
            import { loadMuseKey } from "./backend/src/muse/credential-store.ts";
            if (!await loadMuseKey()) process.exit(1);
            console.log("Muse secret handoff verified. No AI request was made; hosting deployment is not configured here.");
          '
      # Tech lead: insert the authenticated hosting upload/configuration step here,
      # in this same job, using steps.muse.outputs.env-file. See the action README.
      - name: Remove the temporary secret file
        if: always() && steps.muse.outputs.env-file != ''
        env:
          MUSE_ENV_FILE: ${{ steps.muse.outputs.env-file }}
        run: node .github/actions/muse-env/env.mts cleanup
